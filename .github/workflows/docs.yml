name: Deploy dbt docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build dbt docs site
    runs-on: ubuntu-latest
    env:
      DUCKDB_PATH: ${{ github.workspace }}/storage/warehouse/dev.duckdb
      DBT_PROFILES_DIR: ${{ github.workspace }}/transform/dbt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare warehouse directory
        run: mkdir -p storage/warehouse

      - name: Seed bronze layer
        run: python ingestion/run_ingest.py

      - name: Build project and generate docs
        working-directory: transform/dbt
        run: |
          dbt deps
          dbt seed --target dev
          dbt build --target dev
          dbt docs generate --target dev --no-compile

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp -r transform/dbt/target/* _site/
          cp docs/pages/index.html _site/home.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
