name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dbt-build:
    name: dbt build
    runs-on: ubuntu-latest
    env:
      DUCKDB_PATH: ${{ github.workspace }}/storage/warehouse/dev.duckdb
      DBT_PROFILES_DIR: ${{ github.workspace }}/transform/dbt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: mkdir -p storage/warehouse
      - run: python ingestion/run_ingest.py
      - run: dbt deps
        working-directory: transform/dbt
      - run: dbt seed --target dev
        working-directory: transform/dbt
      - run: dbt build --target dev
        working-directory: transform/dbt
      - run: dbt parse --target iceberg
        working-directory: transform/dbt

  pipeline-test:
    name: pipeline smoke test
    runs-on: ubuntu-latest
    env:
      DUCKDB_PATH: ${{ github.workspace }}/storage/warehouse/dev.duckdb
      DBT_PROFILES_DIR: ${{ github.workspace }}/transform/dbt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: mkdir -p storage/warehouse
      - run: python -m unittest tests.test_pipeline -v

  airflow-dag-parse:
    name: Airflow DAG parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install apache-airflow==3.1.0 -r orchestration/airflow/requirements.txt
      - run: python -m py_compile orchestration/airflow/dags/lakehouse_daily.py

  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend=false
      - run: terraform validate
      - run: terraform fmt -check -recursive
