version: 2

sources:
  - name: bronze
    description: |
      Bronze layer events. DuckDB dev uses ingest/seed; Iceberg target reads via Trino.
    database: "{% if target.type == 'trino' %}iceberg{% endif %}"
    schema: bronze
    tables:
      - name: events
        description: Raw product analytics events
        columns:
          - name: id
            description: Source event identifier
          - name: event_type
            description: Event category
          - name: event_timestamp
            description: ISO-8601 UTC timestamp
